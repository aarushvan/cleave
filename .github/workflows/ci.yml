name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build static stripped binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o cleave .
          test "$(wc -c < cleave)" -lt 5000000
          ls -lh cleave
          ./cleave version
          ./cleave --help
