name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Build binaries and checksums
        shell: bash
        run: |
          mkdir -p dist
          build() {
            local target="dist/cleave-$1-$3"
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build \
              -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "$target" .
            test "$(wc -c < "$target")" -lt 5000000
          }
          build darwin arm64 arm64
          build linux amd64 x86_64
          build linux arm64 arm64
          (cd dist && sha256sum cleave-* > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
